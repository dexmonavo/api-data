name: Generate M3U8 Playlist (Playwright)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Patchright
        run: |
          pip install playwright patchright
          # تثبيت متصفح كروم الحقيقي
          playwright install chromium

      - name: Fetch Channels and Build M3U8
        run: |
          python << 'EOF'
          import asyncio
          from patchright.async_api import async_playwright

          # 👇 هنا تضيف كل القنوات التي تريدها
          channels = {
              "aloula": "Al Oula TV",
              # "channel2_name": "Channel 2",
          }

          async def main():
              m3u8_lines = ["#EXTM3U"]
              
              async with async_playwright() as p:
                  # تشغيل المتصفح في وضع عدم العرض (headless) مع بعض الإعدادات
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                  )
                  page = await context.new_page()

                  for ch_id, ch_name in channels.items():
                      api_url = f"https://k101.fallakatv.eu.org/api/morrco/ts.php?channel={ch_id}"
                      print(f"Fetching {ch_id}...")
                      final_url = ""
                      
                      try:
                          # الانتقال إلى الرابط وانتظار انتهاء تحدي Cloudflare
                          await page.goto(api_url, wait_until="networkidle", timeout=60000)
                          
                          # الحصول على محتوى الصفحة بعد الحل
                          content = await page.content()
                          text = await page.inner_text("body")
                          
                          # محاولة استخراج الرابط من النص
                          if text.strip().startswith('http'):
                              final_url = text.strip()
                          # أو البحث عن الرابط في أي مكان داخل محتوى الصفحة
                          elif 'http' in content:
                              import re
                              urls = re.findall(r'https?://[^\s"\']+', content)
                              if urls:
                                  final_url = urls[0]

                          if final_url:
                              m3u8_lines.append(f'#EXTINF:-1 tvg-id="{ch_id}" tvg-name="{ch_name}",{ch_name}')
                              m3u8_lines.append(final_url)
                              print(f"✅ Success: {ch_id}")
                          else:
                              print(f"❌ Could not extract URL for {ch_id}")

                      except Exception as e:
                          print(f"⚠️ Error fetching {ch_id}: {e}")

                  await browser.close()

              with open("playlist.m3u8", "w", encoding="utf-8") as f:
                  f.write("\n".join(m3u8_lines))
              print("Playlist file generated successfully!")

          asyncio.run(main())
          EOF

      - name: Commit and push the M3U8 file
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add playlist.m3u8
          git commit -m "Update M3U8 playlist (Playwright)" || exit 0
          git push

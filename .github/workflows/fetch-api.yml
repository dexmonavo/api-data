name: Generate M3U8 Playlist (Bypass)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cloudscraper
        run: pip install cloudscraper

      - name: Fetch Channels and Build M3U8
        run: |
          python << 'EOF'
          import cloudscraper

          # 👇 ضع القنوات هنا (الاسم في الـ API : الاسم في المشغل)
          channels = {
              "aloula": "Al Oula TV",
              # "mbc": "MBC 1", 
          }

          m3u8_lines = ["#EXTM3U"]

          # إنشاء المتصفح الوهمي الخاص بـ cloudscraper
          scraper = cloudscraper.create_scraper(
              browser={
                  'browser': 'chrome',
                  'platform': 'windows',
                  'desktop': True
              }
          )

          for ch_id, ch_name in channels.items():
              api_url = f"https://k101.fallakatv.eu.org/api/morrco/ts.php?channel={ch_id}"
              print(f"Fetching {ch_id}...")
              
              try:
                  # نطلب الرابط، ونخليه يتبع الـ 302 Redirect تلقائياً
                  # stream=True عشان ميحملش الفيديو كله، بس يقرا الهيدر ويجيب الرابط النهائي
                  res = scraper.get(api_url, allow_redirects=True, stream=True, timeout=30)
                  
                  # res.url بيحتوي على الرابط النهائي بعد الـ 302
                  final_url = res.url

                  if final_url and final_url != api_url:
                      m3u8_lines.append(f'#EXTINF:-1 tvg-id="{ch_id}" tvg-name="{ch_name}",{ch_name}')
                      m3u8_lines.append(final_url)
                      print(f"✅ Success: {ch_id} -> {final_url}")
                  else:
                      print(f"⚠️ Warning: No redirect happened. URL: {final_url}")

              except Exception as e:
                  print(f"⚠️ Error fetching {ch_id}: {e}")

          # حفظ الملف
          with open("playlist.m3u8", "w", encoding="utf-8") as f:
              f.write("\n".join(m3u8_lines))
          print("Playlist file (playlist.m3u8) generated successfully!")
          EOF

      - name: Commit and push the M3U8 file
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add playlist.m3u8
          git commit -m "Update M3U8 playlist" || exit 0
          git push
